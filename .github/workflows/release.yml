name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      packages: write
      issues: write
    steps:
      # Prefer a GitHub App installation token (non-expiring) when APP_ID +
      # APP_PRIVATE_KEY are configured. Fall back to RELEASE_PAT so current
      # prod keeps working until the App is proven. See RELEASING.md.
      - name: Create GitHub App token
        id: app-token
        if: ${{ secrets.APP_ID != '' && secrets.APP_PRIVATE_KEY != '' }}
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # App token (preferred) or RELEASE_PAT so the changeset-release/main
          # branch is pushed by a non-Actions identity. The org disables
          # "Actions can create PRs", so the default GITHUB_TOKEN cannot open
          # the Version Packages PR (HTTP 409).
          token: ${{ steps.app-token.outputs.token || secrets.RELEASE_PAT }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@eq-solutions'

      - run: npm ci

      - uses: changesets/action@v1
        with:
          publish: npm run release
          title: 'chore: version packages'
          commit: 'chore: version packages'
        env:
          # PR creation + git operations run as the App / PAT identity
          # (bypasses org PR block). Prefer App token when present.
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || secrets.RELEASE_PAT }}
          # npm publish to GitHub Packages keeps the ephemeral, repo-scoped token.
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # eq-context's backup/restore/verify jobs alert via Sentry Cron check-ins
      # (if: failure() -> curl the Sentry monitor API) -- that's the suite's
      # only existing CI-failure convention, but it needs a SENTRY_DSN secret
      # and this repo doesn't have one, so reusing it here would just no-op
      # silently instead of fixing anything. This uses the default
      # GITHUB_TOKEN deliberately: it stays valid even when RELEASE_PAT is the
      # thing that expired, which is exactly the failure mode this step exists
      # to catch.
      - name: Open issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          REPO="${{ github.repository }}"
          RUN_URL="${{ github.server_url }}/${REPO}/actions/runs/${{ github.run_id }}"
          TITLE="Release workflow failing on main"
          EXISTING=$(gh issue list --repo "$REPO" --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty' || true)
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "$REPO" --body "Failed again: $RUN_URL" || true
            echo "Commented on existing issue #$EXISTING"
          else
            BODY=$(printf '%s\n\nRun: %s\n\n%s' \
              "The Release workflow (changesets -> npm publish) failed, which blocks every pending version-packages PR from publishing until this is fixed." \
              "$RUN_URL" \
              "Common causes: (1) RELEASE_PAT expired — rotate it, or migrate to the GitHub App (APP_ID + APP_PRIVATE_KEY) documented in RELEASING.md; (2) App credentials misconfigured after migration.")
            gh issue create --repo "$REPO" --title "$TITLE" --body "$BODY" || true
            echo "Opened new failure issue"
          fi
