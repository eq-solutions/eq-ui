name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      packages: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # PAT so the changeset-release/main branch is pushed by a user identity.
          # The org disables "Actions can create PRs", so the default GITHUB_TOKEN
          # cannot open the Version Packages PR (HTTP 409). A PAT bypasses that.
          token: ${{ secrets.RELEASE_PAT }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@eq-solutions'

      - run: npm ci

      - uses: changesets/action@v1
        with:
          publish: npm run release
          title: 'chore: version packages'
          commit: 'chore: version packages'
        env:
          # PR creation + git operations run as the PAT user (bypasses org PR block).
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT }}
          # npm publish to GitHub Packages keeps the ephemeral, repo-scoped token.
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # eq-context's backup/restore/verify jobs alert via Sentry Cron check-ins
      # (if: failure() -> curl the Sentry monitor API) -- that's the suite's
      # only existing CI-failure convention, but it needs a SENTRY_DSN secret
      # and this repo doesn't have one (`gh secret list` shows RELEASE_PAT
      # only), so reusing it here would just no-op silently instead of fixing
      # anything. This uses the default GITHUB_TOKEN instead of RELEASE_PAT
      # deliberately: it stays valid even when RELEASE_PAT is the thing that
      # expired, which is exactly the failure mode this step exists to catch.
      - name: Open issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          REPO="${{ github.repository }}"
          RUN_URL="${{ github.server_url }}/${REPO}/actions/runs/${{ github.run_id }}"
          TITLE="Release workflow failing on main"
          EXISTING=$(gh issue list --repo "$REPO" --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty' || true)
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "$REPO" --body "Failed again: $RUN_URL" || true
            echo "Commented on existing issue #$EXISTING"
          else
            gh issue create --repo "$REPO" --title "$TITLE" --body "The Release workflow (changesets -> npm publish) failed, which blocks every pending version-packages PR from publishing until this is fixed.

Run: $RUN_URL

Common cause: \`RELEASE_PAT\` (used for checkout + changesets/action, so the Version Packages PR can be opened despite the org blocking Actions-created PRs) has expired. Check Settings -> Secrets -> Actions -> RELEASE_PAT and rotate it." || true
            echo "Opened new failure issue"
          fi
