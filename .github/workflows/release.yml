name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      packages: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@eq-solutions'

      - run: npm ci

      - uses: changesets/action@v1
        with:
          publish: npm run release
          title: 'chore: version packages'
          commit: 'chore: version packages'
        env:
          # The built-in token opens the Version Packages PR and publishes.
          # No personal token or App key: nothing here outlives the run.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # eq-context's backup/restore/verify jobs alert via Sentry Cron check-ins
      # (if: failure() -> curl the Sentry monitor API) -- that's the suite's
      # only existing CI-failure convention, but it needs a SENTRY_DSN secret
      # and this repo doesn't have one, so reusing it here would just no-op
      # silently instead of fixing anything.
      - name: Open issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          REPO="${{ github.repository }}"
          RUN_URL="${{ github.server_url }}/${REPO}/actions/runs/${{ github.run_id }}"
          TITLE="Release workflow failing on main"
          EXISTING=$(gh issue list --repo "$REPO" --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty' || true)
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "$REPO" --body "Failed again: $RUN_URL" || true
            echo "Commented on existing issue #$EXISTING"
          else
            BODY=$(printf '%s\n\nRun: %s\n\n%s' \
              "The Release workflow (changesets -> npm publish) failed, which blocks every pending version-packages PR from publishing until this is fixed." \
              "$RUN_URL" \
              "Most likely cause: HTTP 409 — the org setting Allow GitHub Actions to create and approve pull requests was turned off again. See RELEASING.md.")
            gh issue create --repo "$REPO" --title "$TITLE" --body "$BODY" || true
            echo "Opened new failure issue"
          fi
